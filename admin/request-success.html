<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Submitted – GameChanger</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .success-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      padding: 3rem 2rem;
      text-align: center;
    }
    .success-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .success-container h1 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a1a2e;
    }
    .success-container p {
      color: #666;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .success-container a {
      display: inline-block;
      background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
      color: white;
      text-decoration: none;
      padding: 0.75rem 2rem;
      border-radius: 6px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .success-container a:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 212, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="success-container">
    <div class="success-icon">✓</div>
    <h1>Request Received!</h1>
    <p>
      Thank you for requesting access to GameChanger resources. 
      We'll review your request and send you an invitation within 24–48 hours.
    </p>
    <p>
      Keep an eye on your inbox for an email from <strong>noreply@netlify.com</strong> 
      with your access invitation.
    </p>
    <a href="/">Return to GameChanger</a>
  </div>

</body>
</html>
