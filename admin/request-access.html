<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Access – GameChanger Controller Manager</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.web3forms.com; object-src 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com; frame-ancestors 'none';" />
  <link rel="stylesheet" href="/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .access-request-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      padding: 3rem 2rem;
    }
    .access-request-container h1 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a1a2e;
    }
    .access-request-container p {
      color: #666;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .request-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .request-form input,
    .request-form textarea,
    .request-form select {
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1rem;
    }
    .request-form input:focus,
    .request-form textarea:focus,
    .request-form select:focus {
      outline: none;
      border-color: #00d4ff;
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
    }
    .request-form textarea {
      resize: vertical;
      min-height: 120px;
    }
    .request-form button {
      background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
      color: white;
      font-weight: 600;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .request-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 212, 255, 0.2);
    }
    .request-form button:active {
      transform: translateY(0);
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group label {
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #1a1a2e;
      font-size: 0.9rem;
    }
    .back-link {
      text-align: center;
      margin-top: 1rem;
    }
    .back-link a {
      color: #00d4ff;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-link a:hover {
      text-decoration: underline;
    }
    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }
    .success-message.show {
      display: block;
    }
  </style>
</head>
<body>

  <div class="access-request-container">
    <h1>Request Access</h1>
    <p>
      Access to the GameChanger Controller Manager resources is invite-only. 
      Submit your request below, and we'll review it shortly.
    </p>

    <div class="success-message" id="successMessage">
      ✓ Request submitted! We'll review it and be in touch within 24–48 hours.
    </div>

    <form class="request-form" action="https://api.web3forms.com/submit" method="POST" id="accessRequestForm">
      <input type="hidden" name="access_key" value="7065fef3-74a2-4b6d-952d-e6f569e4c81d" />
      <input type="hidden" name="subject" value="New GameChanger Access Request" />
      <input type="hidden" name="from_name" value="GameChanger Access Request Form" />
      <input type="hidden" name="redirect" value="/admin/request-success.html" />
      <input type="hidden" name="botcheck" value="" aria-hidden="true" />

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="form-group">
        <label for="company">Company / Organization</label>
        <input type="text" id="company" name="company" />
      </div>

      <div class="form-group">
        <label for="access_reason">What type of access do you need?</label>
        <select name="access_reason" id="access_reason" required>
          <option value="" selected disabled>Select a reason</option>
          <option value="Investor">Investor / Partner</option>
          <option value="Pilot Tester">Pilot Tester</option>
          <option value="Early Adopter">Early Adopter</option>
          <option value="Developer">Developer / Integration</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">Tell us a bit about yourself (optional)</label>
        <textarea id="message" name="message" placeholder="Why are you interested in GameChanger?"></textarea>
      </div>

      <button type="submit">Submit Access Request</button>
    </form>

    <div class="back-link">
      <a href="/">← Back to GameChanger</a>
    </div>
  </div>

</body>
</html>
