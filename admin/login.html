<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – GameChanger Controller Manager</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' https://identity.netlify.com https://unpkg.com; connect-src 'self' https://identity.netlify.com; frame-src https://identity.netlify.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" />
  <link rel="stylesheet" href="/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 450px;
      width: 100%;
      padding: 3rem 2rem;
    }
    .login-container h1 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a1a2e;
      text-align: center;
    }
    .login-container p {
      color: #666;
      margin-bottom: 2rem;
      text-align: center;
      line-height: 1.6;
    }
    #netlify-identity-container {
      margin-bottom: 2rem;
    }
    .login-divider {
      position: relative;
      text-align: center;
      margin: 2rem 0;
      color: #999;
      font-size: 0.85rem;
    }
    .login-divider:before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #ddd;
    }
    .login-divider span {
      position: relative;
      background: white;
      padding: 0 1rem;
    }
    .access-request-link {
      text-align: center;
      padding-top: 1rem;
      border-top: 1px solid #eee;
    }
    .access-request-link a {
      color: #00d4ff;
      text-decoration: none;
      font-weight: 600;
    }
    .access-request-link a:hover {
      text-decoration: underline;
    }
    .back-link {
      text-align: center;
      margin-top: 1.5rem;
    }
    .back-link a {
      color: #666;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-link a:hover {
      color: #00d4ff;
    }
    /* Override Netlify Identity widget styles */
    .netlify-identity-modal {
      z-index: 9999 !important;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h1>Controller Manager</h1>
    <p>
      Sign in with your invitation to access the Controller Manager, 
      product demo, and resource downloads.
    </p>

    <!-- Netlify Identity Widget will render here -->
    <div id="netlify-identity-container"></div>

    <div class="login-divider">
      <span>or</span>
    </div>

    <div class="access-request-link">
      <p style="margin: 0 0 1rem 0; color: #666; font-size: 0.9rem;">
        Don't have an invitation?
      </p>
      <a href="/admin/request-access.html">Request Access</a>
    </div>

    <div class="back-link">
      <a href="/">← Back to GameChanger</a>
    </div>
  </div>

  <!-- Netlify Identity Script -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // Initialize Netlify Identity
    netlifyIdentity.init();

    // Handle login/signup redirect
    netlifyIdentity.on('login', function(user) {
      console.log('User logged in:', user.email);
      // Redirect to gated resources page after successful login
      window.location.href = '/admin/resources';
    });

    // Show signup form by default (or login, depending on preference)
    netlifyIdentity.open('login');
  </script>

</body>
</html>
